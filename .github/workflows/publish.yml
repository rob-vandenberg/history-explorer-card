name: publish-new-version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published"
        required: true
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version format
        run: echo "${{ github.event.inputs.version }}" | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$"
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build
      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: '["src/history-explorer-card.js", "dist/history-explorer-card.js"]'
          message: "Publishing version ${{ github.event.inputs.version }}"
          tag: "v${{ github.event.inputs.version }}"
      - name: Publish Github release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.event.inputs.version }}"
          name: "v${{ github.event.inputs.version }}"
          body: "Published by Rob Vandenberg"
          makeLatest: true
          artifacts: "dist/history-explorer-card.js,dist/**"
